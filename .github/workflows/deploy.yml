name: Validate DairyFeed
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - run: npm ci --prefix client && npm ci --prefix server
      - run: npm run check
# Render serves the frontend, REST API and WebSocket from the same HTTPS host.
# The previous static-only GitHub Pages deployment could not run the backend.
